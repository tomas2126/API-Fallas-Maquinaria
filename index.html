<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>API - Gestión de Fallas de Maquinaria</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 40px;
        }

        .contenedor {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .descripcion {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        .botones {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin-bottom: 30px;
        }

        button {
            padding: 12px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: #2563eb;
            color: white;
            font-size: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        h2 {
            border-bottom: 2px solid #ddd;
            padding-bottom: 8px;
        }

        pre {
            background: #111827;
            color: #e5e7eb;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            min-height: 150px;
        }
    </style>
</head>

<body>

    <div class="contenedor">

        <h1>API de Gestión de Fallas de Maquinaria</h1>

        <p class="descripcion">
            Aplicación web desarrollada con JavaScript para consumir
            una API REST mediante Fetch.
        </p>

        <div class="botones">

            <button onclick="consultarFallas()">
                Consultar fallas
            </button>

            <button onclick="consultarFallaPorId()">
                Consultar falla por ID
            </button>

            <button onclick="registrarFalla()">
                Registrar falla
            </button>

            <button onclick="actualizarEstado()">
                Actualizar estado
            </button>

        </div>

        <h2>Resultado de la operación</h2>

        <pre id="resultado">Seleccione una operación...</pre>

    </div>

    <script src="script.js"></script>

</body>
</html>
